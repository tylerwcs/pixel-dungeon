<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Choose Your Slot · Pixel Dungeon Chase</title>
  <link rel="stylesheet" href="../style.css?v=celestial-5">
  <link rel="stylesheet" href="../handoff.css?v=lobby-5">
</head>
<body class="join-page">
  <main class="slot-picker-shell">
    <section class="slot-picker-card" aria-labelledby="slotPickerTitle">
      <header class="slot-picker-header">
        <p class="eyebrow">CELESTIAL MATCHMAKING</p>
        <h1 id="slotPickerTitle">Choose your slot</h1>
        <p id="joinCopy">Tap an available quadrant to join the game.</p>
      </header>
      <div id="slotGrid" class="slot-grid" aria-live="polite"></div>
      <section id="savedPass" class="guest-character" hidden>
        <span id="joinImage" class="guest-character-sprite" role="img" aria-label="Saved pixel character"></span>
        <div><small>YOUR CHARACTER</small><strong id="joinName">Your character</strong></div>
        <button id="clearPass" class="text-button" type="button">Use another</button>
      </section>
      <section id="noPass" class="empty-pass" hidden>
        <p>No character pass is saved on this phone yet.</p>
        <a class="primary-button" href="../booth/">Create a character <span>→</span></a>
      </section>
      <div class="slot-picker-actions">
        <button id="readySlot" class="primary-button" type="button" hidden>I’m ready <span>✓</span></button>
        <button id="changeSlot" class="secondary-button" type="button" hidden>↻ Change slot</button>
      </div>
      <p id="joinStatus" class="handoff-status" role="status"></p>
    </section>
  </main>
  <script type="module" src="join.mjs?v=lobby-5"></script>
</body>
</html>
