<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Photo Booth · Pixel Dungeon Chase</title><link rel="stylesheet" href="/style.css?v=celestial-10"><link rel="stylesheet" href="/booth/booth.css?v=portrait-3"></head>
<body><main class="booth-shell crew-shell">
  <img class="booth-masthead" src="/assets/yep-event-logo.webp" alt="Ecopialand Year End Party 2026">
  <label id="photoPicker" class="upload-button upload-icon" aria-label="Choose photo" title="Choose photo"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v14H4zM8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="m4 16 4-4 3 3 3-3 6 6"/></svg><span class="sr-only">Choose photo</span><input class="sr-only" type="file" id="photoFile" accept="image/jpeg,image/png,image/webp"></label>
  <button id="openRecent" class="history-button" type="button" aria-label="Recent attendees" title="Recent attendees" aria-haspopup="dialog" aria-controls="recentDialog"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4v5h5M3.5 9a9 9 0 1 1-.1 6M12 7v5l3 2"/></svg></button>
  <section class="booth-card" id="forge" aria-labelledby="forgeTitle">
    <div class="booth-card-heading"><h1 id="forgeTitle">Create a character</h1><span id="activeCount" class="pill">0 generating</span></div>
    <label class="name-field">Name your character<input id="characterName" maxlength="28" autocomplete="off" placeholder="e.g. Mina"></label>
    <div class="booth-stage"><img id="photoPreview" alt="Selected attendee photo" hidden><video id="cameraPreview" playsinline muted hidden></video><span id="photoPlaceholder">YOUR PHOTO</span></div>
    <div class="booth-controls"><button id="capturePhoto" class="primary-button" type="button" hidden>Take photo & start</button><button id="clearPhoto" class="text-button" type="button">Retake / clear photo</button></div>
    <p id="boothError" class="error" role="alert"></p><button id="generateCharacter" class="primary-button wide" type="button" disabled>Start generation & show QR</button>
  </section>
  <section id="ticketCard" class="booth-card ticket-card" aria-labelledby="ticketTitle" hidden><h2 id="ticketTitle" tabindex="-1">Scan to follow your character</h2>
    <h3 id="ticketName"></h3><canvas id="progressQR" width="260" height="260" aria-label="Personal character progress QR"></canvas><p id="ticketStatus" role="status"></p><button id="nextCharacter" class="primary-button wide" type="button">Generate next character →</button>
  </section>
</main>
<dialog id="recentDialog" class="recent-dialog" aria-labelledby="recentTitle"><div class="recent-heading"><h2 id="recentTitle">Recent attendees</h2><button id="closeRecent" class="history-button" type="button" aria-label="Close recent attendees">×</button></div><p>Choose a guest to show their QR again.</p><p id="recentEmpty">No attendees yet. Take a photo to get started.</p><ul id="recentTickets" class="recent-tickets"></ul></dialog>
<script type="module" src="/booth/booth.mjs?v=portrait-3"></script></body></html>
