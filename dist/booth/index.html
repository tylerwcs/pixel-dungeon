<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Booth · Pixel Dungeon Chase</title>
  <meta name="description" content="Turn a photo into a playable pixel character for Pixel Dungeon Chase.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23070c24' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23e8bd69' d='M16 3l3 8 8 3-8 3-3 9-3-9-8-3 8-3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../style.css?v=celestial-10">
  <link rel="stylesheet" href="booth.css?v=portrait-1">
</head>
<body>
  <main class="booth-shell">
    <section class="booth-card" id="forge" aria-labelledby="forgeTitle">
      <header class="booth-card-heading">
        <div><p class="eyebrow">AI PHOTO FORGE</p><h1 id="forgeTitle">Create your dungeon character</h1></div>
        <span id="libraryCount" class="pill">Checking lobby…</span>
      </header>
      <label class="name-field">Character name<input id="characterName" maxlength="28" autocomplete="off" placeholder="e.g. Mina"></label>
      <div class="booth-stage"><img id="photoPreview" alt="Selected photo preview" hidden><video id="cameraPreview" playsinline muted hidden></video><span id="photoPlaceholder">YOUR PHOTO</span></div>
      <div class="booth-controls">
        <label class="upload-button">Choose or take photo<input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" capture="user"></label>
        <button id="startCamera" class="secondary-button" type="button">Use live camera</button>
        <button id="capturePhoto" class="secondary-button" type="button" hidden>Take snapshot</button>
      </div>
      <p class="error" id="boothError" role="alert"></p>
      <button id="generateCharacter" class="primary-button wide" type="button" disabled>Create pixel character <span>✦</span></button>
    </section>

    <section class="booth-card result-card" id="result" hidden aria-live="polite">
      <header class="booth-card-heading"><div><p class="eyebrow">READY FOR THE CHASE</p><h1 id="resultName">Your character</h1></div></header>
      <div class="result-grid">
        <canvas id="resultPreview" width="320" height="320" aria-label="Generated pixel character preview"></canvas>
        <div class="pass-transfer"><canvas id="passQR" width="220" height="220" aria-label="QR code for saving this character pass"></canvas><strong>SCAN TO MAKE<br>THIS YOUR DEFAULT</strong></div>
      </div>
      <div class="result-actions"><a id="savePass" class="primary-button" href="#" target="_blank">Use on this device <span>→</span></a><a id="downloadCharacter" class="secondary-button" href="#" download="pixel-dungeon-character.png">Save PNG</a><button id="makeAnother" class="secondary-button" type="button">Make another</button></div>
    </section>
  </main>
  <script type="module" src="booth.mjs?v=portrait-1"></script>
</body>
</html>
