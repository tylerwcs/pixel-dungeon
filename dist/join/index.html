<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Choose Your Slot · Pixel Dungeon Chase</title>
  <link rel="stylesheet" href="../style.css?v=celestial-10">
  <link rel="stylesheet" href="../handoff.css?v=gallery-3">
</head>
<body class="join-page">
  <main class="slot-picker-shell">
    <section class="slot-picker-card" aria-labelledby="slotPickerTitle">
      <header class="slot-picker-header">
        <p class="eyebrow">CELESTIAL MATCHMAKING</p>
        <h1 id="slotPickerTitle">Choose your slot</h1>
        <p id="joinCopy">Tap an available quadrant to join the game.</p>
      </header>
      <div id="slotGrid" class="slot-grid" aria-live="polite"></div>
      <section id="selectedCharacter" class="guest-character" hidden>
        <span id="joinImage" class="guest-character-sprite" role="img" aria-label="Selected pixel character"></span>
        <div><small>YOUR CHARACTER</small><strong id="joinName">Your character</strong></div>
        <button id="chooseCharacter" class="text-button" type="button">Change</button>
      </section>
      <section id="noCharacters" class="empty-pass" hidden>
        <p>Choose a character from the shared event lobby.</p>
        <button id="browseCharacters" class="primary-button" type="button">Open character lobby <span>→</span></button>
      </section>
      <div class="slot-picker-actions">
        <button id="readySlot" class="primary-button" type="button" hidden>I’m ready <span>✓</span></button>
      </div>
      <p id="joinStatus" class="handoff-status" role="status"></p>
    </section>
  </main>

  <dialog id="characterLibrary" class="character-library" aria-labelledby="characterLibraryTitle">
    <form method="dialog"><button class="close-button" aria-label="Close character library">×</button></form>
    <p class="eyebrow">SHARED CHARACTER LIBRARY</p>
    <h2 id="characterLibraryTitle">Choose your character</h2>
    <div id="characterGrid" class="character-grid"></div>
  </dialog>
  <script type="module" src="join.mjs?v=gallery-3"></script>
</body>
</html>
